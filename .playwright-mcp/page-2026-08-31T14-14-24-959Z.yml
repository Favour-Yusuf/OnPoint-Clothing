          - paragraph [ref=f1e55]: Shipping is complimentary on orders over ₦20,000; a shipping fee applies below that threshold. Delivery timeframes are estimates and can be affected by factors outside our control, including courier delays and address accuracy. Risk of loss passes to you once an order is delivered to the address provided at checkout.
