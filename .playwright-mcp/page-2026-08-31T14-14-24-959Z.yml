      - generic [ref=f1e34]:
        - generic [ref=f1e35]:
          - heading "About These Terms" [level=2] [ref=f1e36]
          - paragraph [ref=f1e38]: These Terms of Service govern your use of justonpointng.com and any order you place with OnPoint Clothing Nig (“OnPoint,” “we,” “us”). By browsing the site or placing an order, you agree to these terms. If you don’t agree, please don’t use the site.
        - generic [ref=f1e39]:
          - heading "Products & Pricing" [level=2] [ref=f1e40]
          - paragraph [ref=f1e42]: Prices are listed in Nigerian naira (₦) and may change without notice. We make reasonable efforts to display accurate pricing, availability, and product details, but errors can occur. If we discover a pricing or listing error after you’ve placed an order, we’ll contact you before charging or shipping, and you may cancel for a full refund.
        - generic [ref=f1e43]:
          - heading "Orders & Payment" [level=2] [ref=f1e44]
          - paragraph [ref=f1e46]: Orders are processed through Paystack, or by direct bank transfer where offered at checkout. Placing an order is an offer to purchase, which we accept once payment is confirmed. We reserve the right to refuse or cancel an order — for example, on suspicion of fraud, an out-of-stock item, or a pricing error — in which case any payment already taken will be refunded.
        - generic [ref=f1e47]:
          - heading "Bespoke Orders" [level=2] [ref=f1e48]
          - paragraph [ref=f1e50]:
            - text: Bespoke and made-to-order pieces are produced specifically for the customer based on the measurements and specifications provided at the time of order. Production timelines are estimates, not guarantees, and depend on the complexity of the piece. See our
            - link "Returns & Refunds policy" [ref=f1e51] [cursor=pointer]:
              - /url: /returns
            - text: for how bespoke orders are handled if something goes wrong.
        - generic [ref=f1e52]:
