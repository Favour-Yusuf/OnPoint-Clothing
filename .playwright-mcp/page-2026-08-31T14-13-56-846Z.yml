    - generic [ref=e31]:
      - heading "Privacy Policy" [level=1] [ref=e32]
      - paragraph [ref=e33]: Last updated 31 August 2026
      - generic [ref=e34]:
        - paragraph [ref=e35]: This policy explains what personal information OnPoint Clothing Nig (“OnPoint,” “we,” “us”) collects through justonpointng.com, why we collect it, and the choices you have. It applies to visitors, account holders, and anyone who places an order with us.
        - generic [ref=e36]:
          - heading "Information We Collect" [level=2] [ref=e37]
          - generic [ref=e38]:
            - paragraph [ref=e39]: "We collect information you provide directly, including:"
            - list [ref=e40]:
              - listitem [ref=e41]: • Account details — name and email address, when you create an account.
              - listitem [ref=e42]: • Order and shipping information — name, delivery address, phone number, and order contents.
              - listitem [ref=e43]: • Bespoke measurements and preferences, when you submit a bespoke request.
              - listitem [ref=e44]: • Wishlist and saved-product activity, tied to your account.
              - listitem [ref=e45]: • Newsletter sign-up email address.
              - listitem [ref=e46]: • Anything you send us directly by email, phone, or WhatsApp.
            - paragraph [ref=e47]: We do not collect or store your card details — payment is handled directly by Paystack, our payment processor (see “Third Parties” below).
        - generic [ref=e48]:
          - heading "How We Use It" [level=2] [ref=e49]
          - generic [ref=e50]:
            - paragraph [ref=e51]: "We use your information to:"
            - list [ref=e52]:
              - listitem [ref=e53]: • Process and fulfil orders, including bespoke commissions.
              - listitem [ref=e54]: • Create and manage your account, including order history and wishlist.
              - listitem [ref=e55]: • Communicate with you about an order, account, or enquiry.
              - listitem [ref=e56]: • Send newsletter updates, only if you’ve subscribed — you can unsubscribe at any time.
              - listitem [ref=e57]: • Detect and prevent fraud, and meet legal or accounting obligations.
        - generic [ref=e58]:
          - heading "Third Parties We Work With" [level=2] [ref=e59]
          - generic [ref=e60]:
            - paragraph [ref=e61]: "We share the minimum data needed with the following processors to run the site and fulfil orders:"
            - list [ref=e62]:
              - listitem [ref=e63]: • Supabase — hosts our database and handles account authentication.
              - listitem [ref=e64]: • Paystack — processes card and bank-transfer payments; we never see or store your full card number.
              - listitem [ref=e65]: • Cloudinary — hosts product photography (no personal data).
            - paragraph [ref=e66]: Order details are also relayed internally to our own team by email and WhatsApp so we can act on new orders promptly — this is an internal notification, not a third-party data sale.
            - paragraph [ref=e67]: We do not sell your personal information to anyone.
        - generic [ref=e68]:
          - heading "Cookies & Local Storage" [level=2] [ref=e69]
          - paragraph [ref=e71]: We use essential cookies to keep you signed in and to remember your shopping bag between visits. We don’t currently use third-party advertising or tracking cookies.
        - generic [ref=e72]:
          - heading "Data Retention" [level=2] [ref=e73]
          - paragraph [ref=e75]: We keep account and order records for as long as your account is active, and for a reasonable period afterward to meet accounting, tax, and dispute-resolution obligations. You can ask us to delete your account data at any time, subject to records we’re required to keep by law.
        - generic [ref=e76]:
